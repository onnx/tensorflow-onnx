name: Install Path Check
description: Fresh one-command install of TensorFlow and tf2onnx, then import and convert a small function

inputs:
  tf_version:
    description: 'TensorFlow minor version, e.g. "2.15" (installed as "tensorflow==2.15.*")'
    required: true
  tf2onnx_spec:
    description: 'Empty: build tf2onnx from the checked-out commit. Otherwise a pip requirement to install from PyPI instead, e.g. "tf2onnx==1.17.1rc1".'
    default: ''

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Build the tf2onnx wheel from this commit
      if: inputs.tf2onnx_spec == ''
      shell: bash
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel --outdir "$RUNNER_TEMP/dist" .

    - name: Install TensorFlow and tf2onnx in one command
      shell: bash
      env:
        TF_VERSION: ${{ inputs.tf_version }}
        TF2ONNX_SPEC: ${{ inputs.tf2onnx_spec }}
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        . "$RUNNER_TEMP/venv/bin/activate"
        python -m pip install --upgrade pip
        if [ -n "$TF2ONNX_SPEC" ]; then
          python -m pip install "tensorflow==${TF_VERSION}.*" "$TF2ONNX_SPEC"
        else
          python -m pip install "tensorflow==${TF_VERSION}.*" "$RUNNER_TEMP"/dist/tf2onnx-*.whl
        fi
        # Write the resolved versions first, so they are there even if pip check fails.
        {
          echo "### TF ${TF_VERSION}: resolved versions"
          echo '```'
          python -m pip list | grep -i -E '^(tensorflow|onnx|numpy|protobuf|ml[-_]dtypes|tf2onnx) '
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        python -m pip check

    - name: Import and convert a small function
      shell: bash
      run: |
        . "$RUNNER_TEMP/venv/bin/activate"
        # Run outside the checkout so the installed package is imported, not ./tf2onnx.
        cd "$RUNNER_TEMP"
        python - <<'PY'
        import numpy as np
        import onnx
        import tensorflow as tf
        import tf2onnx
        from onnx.reference import ReferenceEvaluator

        assert "site-packages" in tf2onnx.__file__, tf2onnx.__file__
        print("tensorflow", tf.__version__, "onnx", onnx.__version__, "tf2onnx", tf2onnx.__version__)

        @tf.function(input_signature=[tf.TensorSpec([None, 3], tf.float32, name="x")])
        def f(x):
            return tf.nn.relu(tf.matmul(x, tf.ones([3, 2])) - 1.0)

        model, _ = tf2onnx.convert.from_function(f, input_signature=f.input_signature, opset=15)
        onnx.checker.check_model(model)

        x = np.array([[1, 2, 3], [0, 0, 1]], dtype=np.float32)
        (got,) = ReferenceEvaluator(model).run(None, {model.graph.input[0].name: x})
        np.testing.assert_allclose(got, f(x).numpy(), rtol=1e-6)
        print("conversion OK")
        PY
