version: 2
updates:
  - package-ecosystem: "github-actions"
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "github_actions"

  - package-ecosystem: "pip"
    # Keeps the pinned lint tools in requirements-lint.txt current.
    # Runtime dependencies in pyproject.toml are updated manually.
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "ruff"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
