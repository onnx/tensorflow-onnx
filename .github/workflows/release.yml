name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install packaging tools
        run: python -m pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify distribution version and contents
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          expected_version = pathlib.Path("VERSION_NUMBER").read_text(encoding="utf-8").strip()
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          source = next(pathlib.Path("dist").glob("*.tar.gz"))
          assert f"-{expected_version}-" in wheel.name, wheel.name
          assert f"-{expected_version}.tar.gz" in source.name, source.name

          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              entry_points = archive.read(
                  f"tf2onnx-{expected_version}.dist-info/entry_points.txt"
              ).decode()
          assert "tf2onnx/version.py" in names
          assert not any(name.startswith(("tests/", "tools/")) for name in names)
          assert "tf2onnx = tf2onnx.convert:main" in entry_points

          with tarfile.open(source) as archive:
              names = archive.getnames()
          assert any(name.endswith("/VERSION_NUMBER") for name in names)
          assert not any("/setup.py" in name for name in names)
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      contents: read
      id-token: write  # required for trusted publishing (OIDC)

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
